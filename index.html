<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030305">
  <title>Caza Estrellas · Atrapar Limones</title>
  <link href="limones.css" rel="stylesheet">
  <script src="utils.js"></script>
</head>
<body onload="iniciar()">
  <div class="contenedor">
    <header class="hero">
      <div class="hero__eyebrow">◈ ARCADE // NEON EDITION</div>
      <h1>Atrapar <span>Limones</span></h1>
      <p class="hero__sub">Si del cielo te caen limones .....</p>
      <h2>Autor: Josue Vilcacundo</h2>
    </header>

    <section class="game-shell">
      <div class="game-frame">
        <div class="game-frame__top">
          <span class="status-dot"></span>
          <span>LIVE PLAY</span>
          <span class="game-frame__line"></span>
          <span>600 × 400</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="areaJuego" width="600" height="400"></canvas>
          <div class="canvas-glow"></div>
        </div>
      </div>

      <div class="panel">
        <div class="stat">
          <span class="stat__label">PUNTAJE</span>
          <strong id="txtPuntaje">0</strong>
        </div>
        <div class="stat stat--lives">
          <span class="stat__label">VIDAS</span>
          <strong id="txtVidas">3</strong>
        </div>
      </div>

      <div class="botones">
        <button type="button" onclick="moverIzquierda()">
          <span class="button-icon">←</span><span>Izquierda</span>
        </button>
        <button type="button" onclick="moverDerecha()">
          <span>Derecha</span><span class="button-icon">→</span>
        </button>
        <button type="button" class="button--accent" onclick="reiniciar()">
          <span class="button-icon">↻</span><span>Reiniciar</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <span>CAZA LIMONES</span><span>•</span><span>PRECISIÓN · VELOCIDAD · REFLEJOS</span>
    </footer>
  </div>
  <script src="limones.js"></script>
</body>
</html>
